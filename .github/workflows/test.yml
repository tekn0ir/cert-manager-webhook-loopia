name: test
### Workflow for building, vetting and testing cert-manager-webhook-loopia ###
### The conformance suite and the live Loopia API test need real credentials and are run locally, see the readme ###

# Run on push/pull request of Go-files in branch main or manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Echo...
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # Check out code.
      - name: Check out code
        uses: actions/checkout@v4

      # Download the Go toolchain version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Get Go dependencies.
      - name: Get dependencies
        run: go mod download

      # Fail if any Go file is not gofmt formatted.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      # Static analysis.
      - name: Vet
        run: go vet ./...

      # Type-check the conformance test, which is behind the "conformance" build tag,
      # without running it: it needs a booted control plane and a real Loopia zone.
      - name: Vet conformance test
        run: go vet -tags conformance ./...

      # Build the webhook.
      - name: Build
        run: go build ./...

      # Run the tests. The conformance suite and the live Loopia API test skip
      # themselves unless their credentials and zone are configured, so this
      # step needs no secrets and stays green on forks and pull requests.
      - name: Run tests
        run: go test -v ./...
