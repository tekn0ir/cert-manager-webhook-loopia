name: release
### Workflow for testing, building and releasing cert-manager-webhook-loopia ###
### Tests are run without credentials, the conformance suite that needs a real Loopia zone is run locally, see the readme ###
### Container images are published to the GitHub Container Registry (ghcr.io) ###

# Run on push tag or manually.
on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yaml"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  # Run tests.
  test:
    runs-on: ubuntu-latest
    steps:
      # Echo...
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # Check out code.
      - name: Check out code
        uses: actions/checkout@v4

      # Download the Go toolchain version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Get Go dependencies.
      - name: Get dependencies
        run: go mod download

      # Fail if any Go file is not gofmt formatted.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      # Static analysis.
      - name: Vet
        run: go vet ./...

      # Type-check the conformance test, which is behind the "conformance" build tag,
      # without running it: it needs a booted control plane and a real Loopia zone.
      - name: Vet conformance test
        run: go vet -tags conformance ./...

      # Build the webhook.
      - name: Build
        run: go build ./...

      # Run the tests. The conformance suite and the live Loopia API test skip
      # themselves unless their credentials and zone are configured, so this
      # step needs no secrets and the release is never blocked on credentials.
      - name: Run tests
        run: go test -v ./...

  # Build docker image and push it to the GitHub Container Registry (depends on test).
  release_docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Echo...
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # Check out code, required to get latest tag.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get latest tag
      - name: 'Get previous tag'
        id: previoustag
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "tag=${tag:-1.1}" >> "$GITHUB_OUTPUT"

      # GHCR requires an all lowercase image reference, GITHUB_REPOSITORY is not guaranteed to be.
      - name: Set image reference
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Create and boot a Docker-BuildX-builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to the GitHub Container Registry with the workflow token.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build using Dockerfile and push to the GitHub Container Registry.
      - name: Build and push to GHCR
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.previoustag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ACME DNS-01 solver webhook for cert-manager backed by the Loopia DNS API

  # Build helm chart and push to GitHub Pages (depends on test).
  release_helmchart:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    # Check out code.
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
