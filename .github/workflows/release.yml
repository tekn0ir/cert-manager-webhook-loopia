name: release
### Workflow for testing, building and releasing cert-manager-webhook-loopia ###
### Tests are executed using a test-fixure supplied that build up a complete Kubernetes control plane ###
### Container images are published to the GitHub Container Registry (ghcr.io) ###

# Run on push tag or manually.
on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - main
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "**.yaml"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  # Run tests.
  test:
    runs-on: ubuntu-latest
    steps:
      # Echo...
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # Check out code.
      - name: Check out code
        uses: actions/checkout@v4

      # Download the Go toolchain version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Get Go dependencies.
      - name: Get dependencies
        run: go mod download

      # Download the envtest binaries the conformance test fixture boots a control plane with.
      - name: Get test binaries
        run: |
          ASSETS_DIR="$(sh ./testdata/scripts/fetch-test-binaries.sh)"
          echo "KUBEBUILDER_ASSETS=$ASSETS_DIR" >> "$GITHUB_ENV"
          echo "$ASSETS_DIR" >> "$GITHUB_PATH"

      # Fail early, and with a useful message, if the credentials were never configured.
      - name: Verify required secrets
        env:
          LOOPIA_TEST_ZONE_NAME: ${{ secrets.LOOPIA_TEST_ZONE_NAME }}
        run: |
          if [ -z "$LOOPIA_TEST_ZONE_NAME" ]; then
            echo "::error::The repository secrets LOOPIA_USERNAME, LOOPIA_PASSWORD and LOOPIA_TEST_ZONE_NAME must be set to run the conformance test suite."
            exit 1
          fi

      # Add real credentials to loopia-credentials.yaml.
      - name: Apply credentials from secret
        env:
          LOOPIA_USERNAME: ${{ secrets.LOOPIA_USERNAME }}
          LOOPIA_PASSWORD: ${{ secrets.LOOPIA_PASSWORD }}
        run: |
          sed -i -e "s/\[LOOPIA USERNAME\]/$LOOPIA_USERNAME/" testdata/loopia/loopia-credentials.yaml
          sed -i -e "s/\[LOOPIA PASSWORD\]/$LOOPIA_PASSWORD/" testdata/loopia/loopia-credentials.yaml

      # Run conformance tests.
      - name: Run tests
        env:
          # Note the trailing ".", this means the LOOPIA_TEST_ZONE_NAME should not have a trailing ".".
          TEST_ZONE_NAME: ${{ secrets.LOOPIA_TEST_ZONE_NAME }}.
          TEST_STRICT_MODE: "false"
        run: go test -v

  # Build docker image and push it to the GitHub Container Registry (depends on test).
  release_docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Echo...
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # Check out code, required to get latest tag.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Get latest tag
      - name: 'Get previous tag'
        id: previoustag
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          echo "tag=${tag:-1.1}" >> "$GITHUB_OUTPUT"

      # GHCR requires an all lowercase image reference, GITHUB_REPOSITORY is not guaranteed to be.
      - name: Set image reference
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Create and boot a Docker-BuildX-builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to the GitHub Container Registry with the workflow token.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build using Dockerfile and push to the GitHub Container Registry.
      - name: Build and push to GHCR
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.previoustag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ACME DNS-01 solver webhook for cert-manager backed by the Loopia DNS API

  # Build helm chart and push to GitHub Pages (depends on test).
  release_helmchart:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    # Check out code.
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
